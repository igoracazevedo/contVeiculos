<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Ícone para Android / Chrome / iOS embutido via Data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230284c7'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='55'>🚗</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230284c7'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='55'>🚗</text></svg>">

  <!-- Configuração PWA / Tela Cheia Nativa no Android -->
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%20%22Controle%20de%20Ve%C3%ADculos%22,
    %22short_name%22:%20%22Ve%C3%ADculos%22,
    %22start_url%22:%20%22.%22,
    %22display%22:%20%22standalone%22,
    %22background_color%22:%20%22%230b1120%22,
    %22theme_color%22:%20%22%230b1120%22,
    %22icons%22:[{
      %22src%22:%20%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230284c7'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='55'>🚗</text></svg>%22,
      %22sizes%22:%20%22192x192 512x512%22,
      %22type%22:%20%22image/svg+xml%22
    }]
  }">
  <title>Controle de Veículos</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0; background: #0b1120; color: #f1f5f9;
      display: flex; flex-direction: column; min-height: 100vh;
    }

    /* Cabeçalho Mobile Compacto */
    header {
      background: #0b1120; padding: 16px 20px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 700; color: #f8fafc; }
    .btn-reload { background: none; border: none; font-size: 18px; color: #38bdf8; cursor: pointer; }

    /* Área de Conteúdo */
    .container {
      flex: 1; padding: 16px; padding-bottom: 90px; /* espaço para o menu inferior */
      max-width: 480px; width: 100%; margin: 0 auto;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.2s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards de Veículos */
    .car-card {
      position: relative; border-radius: 16px; margin-bottom: 16px;
      overflow: hidden; background-color: #1e293b;
      background-size: cover; background-position: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .car-card-overlay {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.95) 100%);
      padding: 16px;
    }
    .car-card-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    .car-card-header h3 { margin: 0; font-size: 17px; color: #fff; font-weight: 700; }
    .car-card-header .badge {
      background: rgba(56, 189, 248, 0.15); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3); padding: 4px 8px;
      border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    }

    .metric-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .metric-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; padding: 10px 12px;
    }
    .metric-box small {
      display: block; color: #94a3b8; font-size: 10px; margin-bottom: 4px;
      text-transform: uppercase; font-weight: 600;
    }
    .metric-box strong { font-size: 15px; color: #f8fafc; font-weight: 600; }

    /* Barra de Navegação Inferior (Thumb Friendly) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0f172a; border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 10px 12px; z-index: 50;
      max-width: 480px; margin: 0 auto;
    }
    .nav-btn {
      background: none; border: none; color: #64748b;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; cursor: pointer; flex: 1;
    }
    .nav-btn .icon { font-size: 20px; line-height: 1; }
    .nav-btn.active { color: #38bdf8; }

    /* Botão Flutuante Central de Ação (+) */
    .action-fab {
      background: #0284c7; color: white; border: none;
      width: 46px; height: 46px; border-radius: 50%;
      font-size: 24px; font-weight: 300; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.5); cursor: pointer;
      margin-top: -18px;
    }

    /* Modal de Ações Rápidas */
    .fab-menu {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px); z-index: 60; display: none;
      justify-content: flex-end; flex-direction: column; padding: 20px;
    }
    .fab-menu.active { display: flex; }
    .fab-sheet {
      background: #1e293b; border-radius: 16px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.1);
      max-width: 440px; width: 100%; margin: 0 auto;
    }
    .fab-item {
      background: rgba(255,255,255,0.05); border: none; padding: 14px 16px;
      border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600;
      text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .fab-cancel {
      background: none; border: none; color: #94a3b8; padding: 12px;
      text-align: center; font-size: 14px; cursor: pointer;
    }

    /* Formulários Mobile */
    .form-box {
      background: #1e293b; border-radius: 16px; padding: 18px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    label { display: block; margin-top: 12px; font-size: 12px; font-weight: 600; color: #94a3b8; }
    input, select {
      width: 100%; padding: 12px; margin-top: 5px; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; font-size: 15px; background: #0f172a; color: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    .btn-submit {
      width: 100%; margin-top: 18px; padding: 14px; background: #0284c7; color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-gps {
      margin-top: 6px; padding: 8px 12px; font-size: 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1); color: #38bdf8; border-radius: 8px; cursor: pointer;
    }
    .status-msg { margin-top: 12px; font-size: 13px; text-align: center; font-weight: 600; }

    /* Grupos de Mês / Listas */
    .month-group {
      background: #1e293b; border-radius: 14px; margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
    }
    .month-header {
      background: rgba(255,255,255,0.03); padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06); display: flex;
      justify-content: space-between; font-weight: 700; font-size: 13px;
    }
    .history-item {
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1 id="screen-title">Resumo Geral</h1>
    <button class="btn-reload" onclick="carregarDados()">↻</button>
  </header>

  <main class="container">
    <!-- 1. RESUMO -->
    <section id="screen-resumo" class="screen active">
      <div id="resumo-loading" style="text-align:center; padding:30px 0; color:#94a3b8; font-size:13px;">Sincronizando com a planilha...</div>
      <div id="resumo-cards"></div>
    </section>

    <!-- 2. CONSULTA COMBUSTÍVEL -->
    <section id="screen-consultar-gas" class="screen">
      <label>Veículo:</label>
      <select id="filtro-veiculo-gas" onchange="renderizarConsultaGasolina()"></select>
      <div id="lista-consulta-gas" style="margin-top:14px;"></div>
    </section>

    <!-- 3. CONSULTA RECARGAS -->
    <section id="screen-consultar-elec" class="screen">
      <label>Veículo:</label>
      <select id="filtro-veiculo-elec" onchange="renderizarConsultaEnergia(false)"></select>
      <div id="lista-consulta-elec" style="margin-top:14px;"></div>
    </section>

    <!-- 4. CONSULTA ACADEMIA -->
    <section id="screen-consultar-acad" class="screen">
      <label>Veículo:</label>
      <select id="filtro-veiculo-acad" onchange="renderizarConsultaEnergia(true)"></select>
      <div id="lista-consulta-acad" style="margin-top:14px;"></div>
    </section>

    <!-- 5. FORMULÁRIO ABASTECER -->
    <section id="screen-gasolina" class="screen">
      <form class="form-box" onsubmit="salvar(event, 'gasolina')">
        <label>Data e Hora</label>
        <input type="datetime-local" id="gas-datahora" required>
        <label>Veículo</label>
        <select id="gas-placa" required></select>
        <label>KM Atual</label>
        <input type="text" inputmode="numeric" id="gas-km" placeholder="Ex: 8352" required>
        <label>Litros</label>
        <input type="text" inputmode="decimal" id="gas-litros" placeholder="Ex: 35,00" required>
        <label>Valor Total (R$)</label>
        <input type="text" inputmode="decimal" id="gas-valor" placeholder="Ex: 245,95" required>
        <label>Tipo de Gasolina</label>
        <select id="gas-tipo">
          <option value="NORMAL">NORMAL</option>
          <option value="ADITIVADA">ADITIVADA</option>
          <option value="PODIUM">PODIUM</option>
        </select>
        <label>Local GPS</label>
        <input type="text" id="gas-local">
        <button type="button" class="btn-gps" onclick="pegarLocal('gas-local')">📍 Obter GPS</button>
        <button type="submit" class="btn-submit">Salvar na Planilha</button>
        <div class="status-msg" id="msg-gasolina"></div>
      </form>
    </section>

    <!-- 6. FORMULÁRIO RECARREGAR -->
    <section id="screen-energia" class="screen">
      <form class="form-box" onsubmit="salvar(event, 'energia')">
        <label>Data e Hora</label>
        <input type="datetime-local" id="elec-datahora" required>
        <label>Veículo</label>
        <select id="elec-placa" required></select>
        <label>% Inicial</label>
        <input type="text" inputmode="decimal" id="elec-pi" placeholder="Ex: 25,0" required>
        <label>% Final</label>
        <input type="text" inputmode="decimal" id="elec-pf" placeholder="Ex: 68,0" required>
        <label>Consumo (kWh)</label>
        <input type="text" inputmode="decimal" id="elec-kwa" placeholder="Ex: 8,28" required>
        <label>Valor Total (R$)</label>
        <input type="text" inputmode="decimal" id="elec-valor" placeholder="Ex: 16,50" required>
        <label>Local GPS</label>
        <input type="text" id="elec-local">
        <button type="button" class="btn-gps" onclick="pegarLocal('elec-local')">📍 Obter GPS</button>
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer;">
          <input type="checkbox" id="elec-academia" style="width:auto; margin:0;"> Academia?
        </label>
        <button type="submit" class="btn-submit">Salvar na Planilha</button>
        <div class="status-msg" id="msg-energia"></div>
      </form>
    </section>

    <!-- 7. FORMULÁRIO NOVO CARRO -->
    <section id="screen-veiculo" class="screen">
      <form class="form-box" onsubmit="salvar(event, 'veiculo')">
        <label>Placa</label>
        <input type="text" id="veic-placa" placeholder="Ex: TID-5G50" required>
        <label>Marca</label>
        <input type="text" id="veic-marca" placeholder="Ex: BYD" required>
        <label>Modelo</label>
        <input type="text" id="veic-modelo" placeholder="Ex: SONG PRO GS" required>
        <button type="submit" class="btn-submit">Adicionar Veículo</button>
        <div class="status-msg" id="msg-veiculo"></div>
      </form>
    </section>
  </main>

  <!-- Menu de Ações Rápidas (Abre no botão +) -->
  <div class="fab-menu" id="fab-menu" onclick="toggleFab(false)">
    <div class="fab-sheet" onclick="event.stopPropagation()">
      <button class="fab-item" onclick="navigateFromFab('gasolina', 'Novo Abastecimento')">⛽ Novo Abastecimento</button>
      <button class="fab-item" onclick="navigateFromFab('energia', 'Nova Recarga')">🔋 Nova Recarga</button>
      <button class="fab-item" onclick="navigateFromFab('veiculo', 'Cadastrar Veículo')">🚗 Cadastrar Carro</button>
      <button class="fab-cancel" onclick="toggleFab(false)">Cancelar</button>
    </div>
  </div>

  <!-- Bottom Navigation Fixa -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="btn-nav-resumo" onclick="navigate('resumo', 'Resumo Geral', this)">
      <span class="icon">🏠</span>
      <span>Início</span>
    </button>
    <button class="nav-btn" id="btn-nav-gas" onclick="navigate('consultar-gas', 'Combustível', this)">
      <span class="icon">⛽</span>
      <span>Gasolina</span>
    </button>
    
    <button class="action-fab" onclick="toggleFab(true)">+</button>

    <button class="nav-btn" id="btn-nav-elec" onclick="navigate('consultar-elec', 'Recargas', this)">
      <span class="icon">⚡</span>
      <span>Energia</span>
    </button>
    <button class="nav-btn" id="btn-nav-acad" onclick="navigate('consultar-acad', 'Academia', this)">
      <span class="icon">🏋️</span>
      <span>Academia</span>
    </button>
  </nav>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw2eaaPCNMQbCcC3mVJKnDtcmJx11itHGB1KVukEC-6X3NvVK4WmVfwk3rTfQt9ry25/exec";

    let DB = { veiculos: [], abastecimentos: [], recargas: [] };

    function toggleFab(open) {
      document.getElementById('fab-menu').classList.toggle('active', open);
    }

    function navigateFromFab(screenId, title) {
      toggleFab(false);
      navigate(screenId, title, null);
    }

    function navigate(screenId, title, elem) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById('screen-' + screenId).classList.add('active');
      document.getElementById('screen-title').innerText = title;
      
      if (elem) {
        elem.classList.add('active');
      }

      if (screenId === 'consultar-gas') renderizarConsultaGasolina();
      if (screenId === 'consultar-elec') renderizarConsultaEnergia(false);
      if (screenId === 'consultar-acad') renderizarConsultaEnergia(true);
    }

    function formataReal(v) {
      return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formataDec(v, decimais = 2) {
      return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: decimais, maximumFractionDigits: decimais });
    }

    function normalizarInput(val) {
      if (!val) return 0;
      return String(val).trim().replace(/\./g, "").replace(",", ".");
    }

    function extrairMesAno(dataStr) {
      if (!dataStr) return "Outros";
      const p = String(dataStr).split(' ')[0].split('/');
      return p.length === 3 ? `${p[1]}/${p[2]}` : "Outros";
    }

    function ordenarMesesDesc(a, b) {
      const [mA, yA] = a.split('/').map(Number);
      const [mB, yB] = b.split('/').map(Number);
      if (yA !== yB) return yB - yA;
      return mB - mA;
    }

    window.processarDadosPlanilha = function(res) {
      const loading = document.getElementById('resumo-loading');
      if (!res || res.status !== "success") {
        loading.innerText = "Erro retornado: " + (res ? res.message : "Sem dados.");
        loading.style.color = "#ef4444";
        return;
      }

      try {
        DB = res;
        renderizarResumo();
        popularDropdowns();
      } catch (err) {
        loading.innerText = "Erro ao processar: " + err.message;
        loading.style.color = "#ef4444";
      }
    };

    async function carregarDados() {
      const loading = document.getElementById('resumo-loading');
      loading.style.display = 'block';
      loading.innerText = "Sincronizando com a planilha...";

      try {
        const response = await fetch(API_URL, { redirect: "follow" });
        if (response.ok) {
          const res = await response.json();
          window.processarDadosPlanilha(res);
          return;
        }
      } catch (err) {}

      const antigo = document.getElementById('jsonp-script');
      if (antigo) antigo.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      const sep = API_URL.includes('?') ? '&' : '?';
      script.src = `${API_URL}${sep}callback=processarDadosPlanilha&_=${Date.now()}`;
      script.onerror = function() {
        loading.innerText = "Erro ao acessar a planilha.";
        loading.style.color = "#ef4444";
      };
      document.body.appendChild(script);
    }

    function popularDropdowns() {
      const dropdowns = [
        document.getElementById('gas-placa'),
        document.getElementById('elec-placa'),
        document.getElementById('filtro-veiculo-gas'),
        document.getElementById('filtro-veiculo-elec'),
        document.getElementById('filtro-veiculo-acad')
      ];

      dropdowns.forEach(el => { if (el) el.innerHTML = ''; });

      (DB.veiculos || []).forEach(v => {
        const opt = `<option value="${v.placa}">${v.placa} - ${v.marca} ${v.modelo}</option>`;
        dropdowns.forEach(el => { if (el) el.innerHTML += opt; });
      });
    }

    function renderizarResumo() {
      document.getElementById('resumo-loading').style.display = 'none';
      const container = document.getElementById('resumo-cards');
      container.innerHTML = '';

      if (!DB.veiculos || DB.veiculos.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:20px;">Nenhum veículo encontrado.</p>';
        return;
      }

      DB.veiculos.forEach(v => {
        const gasDoCarro = (DB.abastecimentos || []).filter(a => a.placa === v.placa);
        const elecDoCarro = (DB.recargas || []).filter(r => r.placa === v.placa);

        const totalGas = gasDoCarro.reduce((acc, a) => acc + (a.valor || 0), 0);
        const totalLitros = gasDoCarro.reduce((acc, a) => acc + (a.litros || 0), 0);
        const totalElec = elecDoCarro.reduce((acc, r) => acc + (r.valor || 0), 0);

        let mediaKmL = "0,00";
        if (gasDoCarro.length > 1 && totalLitros > 0) {
          const kms = gasDoCarro.map(a => Number(a.km) || 0).filter(k => k > 0);
          if (kms.length > 1) {
            const minKm = Math.min(...kms);
            const maxKm = Math.max(...kms);
            mediaKmL = formataDec((maxKm - minKm) / totalLitros, 2);
          }
        }

        const bgEstilo = v.foto ? `style="background-image: url('${v.foto}');"` : '';

        container.innerHTML += `
          <div class="car-card" ${bgEstilo}>
            <div class="car-card-overlay">
              <div class="car-card-header">
                <h3>${v.marca} ${v.modelo}</h3>
                <span class="badge">${v.placa}</span>
              </div>
              <div class="metric-grid">
                <div class="metric-box">
                  <small>Gasolina</small>
                  <strong>${formataReal(totalGas)}</strong>
                </div>
                <div class="metric-box">
                  <small>Energia</small>
                  <strong>${formataReal(totalElec)}</strong>
                </div>
                <div class="metric-box">
                  <small>Total Geral</small>
                  <strong style="color:#38bdf8;">${formataReal(totalGas + totalElec)}</strong>
                </div>
                <div class="metric-box">
                  <small>Média Geral</small>
                  <strong>${mediaKmL} km/l</strong>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function renderizarConsultaGasolina() {
      const placa = document.getElementById('filtro-veiculo-gas').value;
      const container = document.getElementById('lista-consulta-gas');
      container.innerHTML = '';

      const filtrados = (DB.abastecimentos || []).filter(a => a.placa === placa);
      const meses = {};
      filtrados.forEach(a => {
        const m = extrairMesAno(a.data);
        if (!meses[m]) meses[m] = [];
        meses[m].push(a);
      });

      const mesesOrdenados = Object.keys(meses).sort(ordenarMesesDesc);

      if (mesesOrdenados.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:20px;">Nenhum abastecimento encontrado.</p>';
        return;
      }

      mesesOrdenados.forEach(mes => {
        const itens = meses[mes];
        const totalMesValor = itens.reduce((s, i) => s + (i.valor || 0), 0);
        const totalMesLitros = itens.reduce((s, i) => s + (i.litros || 0), 0);

        let htmlItens = itens.map(i => `
          <div class="history-item">
            <div>
              <strong style="color:#f8fafc;">${i.data}</strong> <span style="font-size:11px; color:#94a3b8;">(${i.tipoGasolina})</span><br>
              <small style="color:#94a3b8;">Km: ${formataDec(i.km, 0)} | ${formataDec(i.litros, 2)} L</small>
            </div>
            <div style="font-weight:700; color:#38bdf8;">${formataReal(i.valor)}</div>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="month-group">
            <div class="month-header">
              <span>Mês: ${mes}</span>
              <span style="color:#38bdf8;">${formataReal(totalMesValor)} (${formataDec(totalMesLitros, 1)} L)</span>
            </div>
            ${htmlItens}
          </div>
        `;
      });
    }

    function renderizarConsultaEnergia(apenasAcademia) {
      const selectId = apenasAcademia ? 'filtro-veiculo-acad' : 'filtro-veiculo-elec';
      const containerId = apenasAcademia ? 'lista-consulta-acad' : 'lista-consulta-elec';
      const placa = document.getElementById(selectId).value;
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      const filtrados = (DB.recargas || []).filter(r => r.placa === placa && (apenasAcademia ? r.academia === true : r.academia !== true));
      
      const meses = {};
      filtrados.forEach(r => {
        const m = extrairMesAno(r.data);
        if (!meses[m]) meses[m] = [];
        meses[m].push(r);
      });

      const mesesOrdenados = Object.keys(meses).sort(ordenarMesesDesc);

      if (mesesOrdenados.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8; text-align:center; padding:20px;">Nenhuma recarga encontrada.</p>`;
        return;
      }

      // Modo Academia: Contagem x R$ 60,00
      if (apenasAcademia) {
        mesesOrdenados.forEach(mes => {
          const qtd = meses[mes].length;
          const totalMes = qtd * 60;

          container.innerHTML += `
            <div class="month-group" style="padding: 14px 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-weight: 700; font-size: 15px; color: #f8fafc;">Mês: ${mes}</span>
                <span style="font-size: 16px; font-weight: 700; color: #4ade80;">${formataReal(totalMes)}</span>
              </div>
              <div style="font-size: 12px; color: #94a3b8;">
                ${qtd} ${qtd === 1 ? 'ida' : 'idas'} no mês (R$ 60,00 cada)
              </div>
            </div>
          `;
        });
        return;
      }

      // Modo Recargas Normais
      mesesOrdenados.forEach(mes => {
        const itens = meses[mes];
        const totalMesValor = itens.reduce((s, i) => s + (i.valor || 0), 0);
        const totalMesKwa = itens.reduce((s, i) => s + (i.kwa || 0), 0);

        let htmlItens = itens.map(i => `
          <div class="history-item">
            <div>
              <strong style="color:#f8fafc;">${i.data}</strong><br>
              <small style="color:#94a3b8;">${formataDec(i.percInicial, 1)}% ➔ ${formataDec(i.percFinal, 1)}% | ${formataDec(i.kwa, 2)} kWh</small>
            </div>
            <div style="font-weight:700; color:#4ade80;">${formataReal(i.valor)}</div>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="month-group">
            <div class="month-header">
              <span>Mês: ${mes}</span>
              <span style="color:#4ade80;">${formataReal(totalMesValor)} (${formataDec(totalMesKwa, 1)} kWh)</span>
            </div>
            ${htmlItens}
          </div>
        `;
      });
    }

    function pegarLocal(inputId) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => document.getElementById(inputId).value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`,
          () => alert("Ative a localização no celular.")
        );
      }
    }

    async function salvar(e, tipo) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const msg = document.getElementById('msg-' + tipo);
      btn.disabled = true;
      msg.style.color = "#38bdf8";
      msg.innerText = "Gravando na planilha...";

      let payload = { tipo };
      if (tipo === 'gasolina') {
        payload.dataHora = document.getElementById('gas-datahora').value;
        payload.placa = document.getElementById('gas-placa').value;
        payload.km = normalizarInput(document.getElementById('gas-km').value);
        payload.litros = normalizarInput(document.getElementById('gas-litros').value);
        payload.valor = normalizarInput(document.getElementById('gas-valor').value);
        payload.tipoGasolina = document.getElementById('gas-tipo').value;
        payload.local = document.getElementById('gas-local').value;
      } else if (tipo === 'energia') {
        payload.dataHora = document.getElementById('elec-datahora').value;
        payload.placa = document.getElementById('elec-placa').value;
        payload.percInicial = normalizarInput(document.getElementById('elec-pi').value);
        payload.percFinal = normalizarInput(document.getElementById('elec-pf').value);
        payload.kwa = normalizarInput(document.getElementById('elec-kwa').value);
        payload.valor = normalizarInput(document.getElementById('elec-valor').value);
        payload.local = document.getElementById('elec-local').value;
        payload.academia = document.getElementById('elec-academia').checked;
      } else if (tipo === 'veiculo') {
        payload.placa = document.getElementById('veic-placa').value;
        payload.marca = document.getElementById('veic-marca').value;
        payload.modelo = document.getElementById('veic-modelo').value;
      }

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        msg.style.color = "#4ade80";
        msg.innerText = "✓ Salvo com sucesso!";
        e.target.reset();
        setTimeout(carregarDados, 1500);
      } catch (err) {
        msg.style.color = "#ef4444";
        msg.innerText = "Erro ao conectar.";
      } finally {
        btn.disabled = false;
      }
    }

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    const dtISO = now.toISOString().slice(0, 16);
    const gasDt = document.getElementById('gas-datahora');
    const elecDt = document.getElementById('elec-datahora');
    if (gasDt) gasDt.value = dtISO;
    if (elecDt) elecDt.value = dtISO;

    carregarDados();
  </script>
</body>
</html>
